<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>zClock · 提词器</title>
<style>
:root{color-scheme:dark;--bg:#101512;--panel:#19221c;--text:#f1f4e9;--muted:#a9b9ab;--line:#34453a;--accent:#cdf48a;--size:clamp(28px,4.5vw,64px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif}body.light{color-scheme:light;--bg:#f8f6ed;--panel:#eeeee3;--text:#17221a;--muted:#536653;--line:#c8cfbe;--accent:#315d17}header{padding:20px clamp(16px,4vw,64px) 16px;border-bottom:1px solid var(--line);background:var(--panel)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:700}.pill{font-size:13px;color:var(--muted);max-width:65%;text-align:right}h1{font-size:clamp(20px,2.2vw,30px);margin:12px 0 7px;line-height:1.4;overflow-wrap:anywhere}.meta{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14px}#clock{font-variant-numeric:tabular-nums;color:var(--accent)}nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px clamp(12px,4vw,64px);border-bottom:1px solid var(--line)}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 13px;border-radius:8px;min-height:44px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button.active{color:var(--bg);background:var(--accent);border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}label{display:flex;gap:7px;align-items:center;font-size:14px;color:var(--muted)}input[type=range]{width:88px;accent-color:var(--accent)}main{height:calc(100vh - var(--chrome,260px));height:calc(100dvh - var(--chrome,260px));overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:clamp(24px,5vw,72px);padding-bottom:35vh;scroll-behavior:auto}#notes{max-width:1400px;margin:0 auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--size);line-height:1.75;letter-spacing:.02em}#notes.mirror{transform:scaleX(-1)}.hint{font-size:13px;color:var(--muted);padding:8px 16px;text-align:center;border-top:1px solid var(--line)}.focus header,.focus nav,.focus .hint{display:none}.focus main{height:100vh}.focus #exitFocus{display:block}#exitFocus{display:none;position:fixed;right:16px;top:12px;z-index:10;opacity:.65}#connection.offline{color:#f4a58a}.error{color:#f4a58a}@media(max-width:600px){header{padding-top:14px}nav{gap:6px}button,select{padding:8px 10px}main{padding:24px 20px 35vh}.hint{display:none}label.speed{margin-left:auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div class="top"><span class="brand">zClock / 提词器</span><span id="connection" class="pill" role="status">正在连接…</span></div><h1 id="title">等待 PowerPoint 放映</h1><div class="meta"><span id="deck">设备独立设置 · 自动跟随演讲</span><span id="page">— / —</span><span id="clock"></span></div></header>
<nav aria-label="提词器控制"><button id="prev" title="查看上一页备注，不控制幻灯片">← 上页</button><button id="follow" class="active" aria-pressed="true">跟随放映</button><button id="next" title="查看下一页备注，不控制幻灯片">下页 →</button><button id="smaller" aria-label="缩小字号">A−</button><button id="larger" aria-label="放大字号">A＋</button><button id="theme">浅色</button><button id="mirror" aria-pressed="false">镜像</button><button id="auto" aria-pressed="false">自动滚动</button><label class="speed">速度 <input id="speed" type="range" min="5" max="100" value="25" aria-label="自动滚动速度"></label><button id="top">回顶部</button><button id="focus">专注</button><button id="fullscreen">全屏</button></nav>
<main id="reader" tabindex="0" aria-label="当前幻灯片备注"><article id="notes">打开 PowerPoint 并开始放映，当前页的备注将自动出现在这里。

鼠标滚轮 / 手指滑动：滚动备注
左右滑动 / 方向键：预览相邻页备注
“跟随放映”：返回演讲者当前页</article></main><footer class="hint">↑ ↓ 滚动 · ← → 预览备注 · 空格 自动滚动 · F 专注 · 预览不会切换 PowerPoint 幻灯片</footer><button id="exitFocus">退出专注</button>
<script>
'use strict';
const $=id=>document.getElementById(id), reader=$('reader');
let scrollCarry=0; let state=null,view=0,following=true,auto=false,lastTime=0,seen='',wake=null;
let prefs={scale:1,light:false,mirror:false,speed:25};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('zclock-prompter')||'{}'))}catch(e){}
prefs.scale=Math.min(2.5,Math.max(.6,Number(prefs.scale)||1));prefs.speed=Math.min(100,Math.max(5,Number(prefs.speed)||25));
function save(){try{localStorage.setItem('zclock-prompter',JSON.stringify(prefs))}catch(e){}}
function appearance(){document.body.classList.toggle('light',!!prefs.light);$('notes').classList.toggle('mirror',!!prefs.mirror);$('mirror').classList.toggle('active',!!prefs.mirror);$('mirror').setAttribute('aria-pressed',!!prefs.mirror);$('theme').textContent=prefs.light?'深色':'浅色';document.documentElement.style.setProperty('--size',`clamp(${Math.round(28*prefs.scale)}px,${4.5*prefs.scale}vw,${Math.round(64*prefs.scale)}px)`);$('speed').value=prefs.speed;save();layout()}
function layout(){document.documentElement.style.setProperty('--chrome',`${document.querySelector('header').offsetHeight+document.querySelector('nav').offsetHeight+document.querySelector('footer').offsetHeight}px`)}
function render(){if(!state)return;if(!state.presenting){$('title').textContent=state.status||'等待 PowerPoint 放映';$('deck').textContent=state.presentation||'zClock 提词器';$('page').textContent='— / —';$('clock').textContent='';if(seen!=='waiting'){$('notes').textContent='放映开始后，这里会自动显示当前页的备注。';reader.scrollTop=0;seen='waiting'}$('prev').disabled=$('next').disabled=true;return}if(!state.previewEnabled)following=true;if(following)view=state.current;view=Math.min(state.total,Math.max(1,view));const slide=state.slides.find(s=>s.index===view);$('title').textContent=slide?slide.title:`第 ${view} 页`;$('deck').textContent=state.presentation;$('page').textContent=`${view} / ${state.total}`+(following?' · 跟随中':' · 预览');$('clock').textContent=(state.paused?'已暂停 · ':'倒计时 ')+state.timer;const text=slide?(slide.notes||'本页没有备注。'):'正在读取本页备注…';const identity=state.deck+'|'+view+'|'+text;if(seen!==identity){$('notes').textContent=text;reader.scrollTop=0;seen=identity} $('prev').disabled=!state.previewEnabled||view<=1;$('next').disabled=!state.previewEnabled||view>=state.total;document.querySelector('footer').textContent=state.previewEnabled?'↑ ↓ 滚动 · ← → 预览备注 · 空格 自动滚动 · F 专注':'仅共享当前页 · 空格 自动滚动 · F 专注';$('follow').classList.toggle('active',following);$('follow').setAttribute('aria-pressed',following)}
function browse(delta){if(!state||!state.presenting||!state.previewEnabled)return;following=false;view=Math.min(state.total,Math.max(1,view+delta));render()}
$('prev').onclick=()=>browse(-1);$('next').onclick=()=>browse(1);$('follow').onclick=()=>{following=true;render()};
$('smaller').onclick=()=>{prefs.scale=Math.max(.6,prefs.scale-.1);appearance()};$('larger').onclick=()=>{prefs.scale=Math.min(2.5,prefs.scale+.1);appearance()};$('theme').onclick=()=>{prefs.light=!prefs.light;appearance()};$('mirror').onclick=()=>{prefs.mirror=!prefs.mirror;appearance()};$('speed').oninput=()=>{prefs.speed=Number($('speed').value);save()};
function toggleAuto(){auto=!auto;scrollCarry=0;lastTime=0;$('auto').classList.toggle('active',auto);$('auto').setAttribute('aria-pressed',auto);$('auto').textContent=auto?'停止滚动':'自动滚动'}$('auto').onclick=toggleAuto;
$('top').onclick=()=>reader.scrollTop=0;
function focus(){document.body.classList.toggle('focus');layout()}$('focus').onclick=focus;$('exitFocus').onclick=focus;
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else{$('connection').textContent='此浏览器不支持全屏，请使用专注模式'}}catch(e){$('connection').textContent='无法进入全屏，可使用专注模式'}};
async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible'){if(wake)await wake.release();wake=await navigator.wakeLock.request('screen')}}catch(e){}}
document.addEventListener('pointerdown',keepAwake,{once:true});document.addEventListener('visibilitychange',()=>{lastTime=0;keepAwake()});
function frame(t){if(auto&&lastTime&&document.visibilityState==='visible'){scrollCarry+=Math.min(t-lastTime,100)/1000*prefs.speed;const pixels=Math.floor(scrollCarry);if(pixels){reader.scrollTop+=pixels;scrollCarry-=pixels}}lastTime=t;requestAnimationFrame(frame)}requestAnimationFrame(frame);
let touch=null;reader.addEventListener('touchstart',e=>{touch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});reader.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*1.8)browse(dx<0?1:-1);touch=null},{passive:true});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.key==='ArrowLeft'){browse(-1);e.preventDefault()}if(e.key==='ArrowRight'){browse(1);e.preventDefault()}if(e.code==='Space'){toggleAuto();e.preventDefault()}if(e.key.toLowerCase()==='f')focus();if(e.key==='Escape'&&document.body.classList.contains('focus'))focus()});
async function poll(){let timeout;try{const ctrl=new AbortController();timeout=setTimeout(()=>ctrl.abort(),5000);const response=await fetch('state',{cache:'no-store',signal:ctrl.signal});if(!response.ok)throw Error('HTTP '+response.status);const next=await response.json();if(state&&state.deck!==next.deck){following=true;seen=''}state=next;render();$('connection').textContent='● 已连接 · 实时同步';$('connection').classList.remove('offline')}catch(e){$('connection').textContent='连接中断 · 正在重连（保留最后内容）';$('connection').classList.add('offline')}finally{clearTimeout(timeout);setTimeout(poll,650)}}
window.addEventListener('resize',layout);appearance();poll();
</script></body></html>
